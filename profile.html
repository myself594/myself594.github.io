<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 禁止缓存的 Meta 标签 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>个人中心 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.04);
            --danger: #FF4757;
            --success: #2ECC71;
            --border-radius: 12px;
            --border-radius-small: 8px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
        }
        
        .profile-header {
            text-align: center;
            padding: 20px 0 24px;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 3px solid var(--primary);
            position: relative;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: var(--shadow);
        }
        
        .profile-avatar-edit {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: white;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-light);
            border: 2px solid white;
            transition: all 0.3s;
        }
        
        .profile-avatar-edit:hover {
            transform: scale(1.1);
            background-color: var(--primary);
            color: white;
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .profile-name-edit {
            font-size: 16px;
            color: var(--primary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .profile-name-edit:hover {
            background-color: rgba(255, 107, 139, 0.1);
            transform: scale(1.1);
        }
        
        .relationship-info {
            margin-bottom: 24px;
        }
        
        .relationship-status {
            font-size: 15px;
            color: var(--success);
            margin-bottom: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .relationship-status.disconnected {
            color: #999;
        }
        
        .relationship-date {
            font-size: 13px;
            color: #666;
            margin-bottom: 14px;
        }
        
        .relationship-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn-small {
            padding: 10px 14px;
            border: none;
            border-radius: var(--border-radius-small);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-small.secondary {
            background-color: rgba(255, 107, 139, 0.1);
            color: var(--primary);
            border: 1px solid rgba(255, 107, 139, 0.2);
        }
        
        .btn-small.secondary:hover {
            background-color: rgba(255, 107, 139, 0.15);
            transform: translateY(-1px);
        }
        
        .btn-small.danger {
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 71, 87, 0.2);
        }
        
        .btn-small.danger:hover {
            background-color: var(--danger);
            color: white;
            transform: translateY(-1px);
        }
        
        .btn-small.primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(255, 107, 139, 0.3);
        }
        
        .btn-small.primary:hover {
            background-color: #ff5577;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.4);
        }
        
        .menu-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background-color: rgba(255, 107, 139, 0.04);
        }
        
        .menu-item:active {
            transform: scale(0.98);
        }
        
        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius-small);
            background-color: rgba(255, 107, 139, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            color: var(--primary);
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .menu-item:hover .menu-icon {
            background-color: rgba(255, 107, 139, 0.15);
            transform: scale(1.05);
        }
        
        .menu-text {
            flex: 1;
            font-weight: 600;
            font-size: 15px;
            color: var(--dark);
        }
        
        .menu-arrow {
            color: #ccc;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .menu-item:hover .menu-arrow {
            color: var(--primary);
            transform: translateX(2px);
        }
        
        .menu-item.danger .menu-icon {
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--danger);
        }
        
        .menu-item.danger:hover .menu-icon {
            background-color: rgba(255, 71, 87, 0.15);
        }
        
        .menu-item.danger .menu-text {
            color: var(--danger);
        }
        
        .menu-item.danger:hover .menu-arrow {
            color: var(--danger);
        }
        
        .menu-item.relationship {
            background-color: rgba(255, 107, 139, 0.02);
        }
        
        .menu-item.relationship:hover {
            background-color: rgba(255, 107, 139, 0.06);
        }
        
        .menu-item.relationship .menu-icon {
            background-color: rgba(255, 107, 139, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <div class="profile-avatar">
                🐰
                <div class="profile-avatar-edit" onclick="editAvatar()">✏️</div>
            </div>
            <div class="profile-name">
                <span id="userName">兔兔</span>
                <span class="profile-name-edit" onclick="editName()">✏️</span>
            </div>
            
            <div class="relationship-info">
                <div class="relationship-status connected" id="relationshipStatus">
                    💕 已与熊大绑定
                </div>
                <div class="relationship-date" id="relationshipDate">
                    在一起时间：2024年6月10日
                </div>
                <div class="relationship-actions" id="relationshipActions">
                    <button class="btn-small secondary" onclick="editRelationshipDate()">修改日期</button>
                    <button class="btn-small danger" onclick="unbindRelationship()">解除绑定</button>
                </div>
            </div>
        </div>
        
        <div class="menu-container">
            <div class="menu-item relationship" onclick="showRelationshipSettings()">
                <div class="menu-icon">💕</div>
                <div class="menu-text">情侣设置</div>
                <div class="menu-arrow">›</div>
            </div>
            
            <div class="menu-item" onclick="showNicknameSettings()">
                <div class="menu-icon">✏️</div>
                <div class="menu-text">昵称设置</div>
                <div class="menu-arrow">›</div>
            </div>
            
            <div class="menu-item" onclick="showAboutUs()">
                <div class="menu-icon">ℹ️</div>
                <div class="menu-text">关于我们</div>
                <div class="menu-arrow">›</div>
            </div>
            
            <div class="menu-item" onclick="showFeedback()">
                <div class="menu-icon">💬</div>
                <div class="menu-text">意见反馈</div>
                <div class="menu-arrow">›</div>
            </div>
            
            <div class="menu-item" onclick="contactService()">
                <div class="menu-icon">🎧</div>
                <div class="menu-text">联系客服</div>
                <div class="menu-arrow">›</div>
            </div>
            
            <div class="menu-item danger" onclick="logout()">
                <div class="menu-icon">🚪</div>
                <div class="menu-text">退出登录</div>
                <div class="menu-arrow">›</div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据状态
        let isConnected = true;
        let partnerName = '熊大';
        let relationshipStartDate = '2024-06-10';
        let userName = '兔兔';

        // 编辑头像
        function editAvatar() {
            alert('头像编辑功能开发中...');
        }

        // 编辑昵称
        function editName() {
            const newName = prompt('请输入新的昵称:', userName);
            if (newName && newName.trim()) {
                userName = newName.trim();
                document.getElementById('userName').textContent = userName;
            }
        }

        // 情侣设置页面
        function showRelationshipSettings() {
            alert('情侣设置页面开发中...\n可以在这里管理关系状态、纪念日等');
        }

        // 昵称设置页面
        function showNicknameSettings() {
            alert('昵称设置页面开发中...');
        }

        // 修改在一起日期
        function editRelationshipDate() {
            const newDate = prompt('请输入在一起的日期 (格式: YYYY-MM-DD):', relationshipStartDate);
            if (newDate && newDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                relationshipStartDate = newDate;
                updateRelationshipDisplay();
            } else if (newDate) {
                alert('日期格式不正确，请使用 YYYY-MM-DD 格式');
            }
        }

        // 解除绑定
        function unbindRelationship() {
            if (confirm('确定要解除与' + partnerName + '的绑定吗？')) {
                isConnected = false;
                updateRelationshipDisplay();
            }
        }

        // 邀请绑定
        function inviteBind() {
            const inviteCode = 'LOVE' + Math.random().toString(36).substr(2, 6).toUpperCase();
            alert('邀请码已生成：' + inviteCode + '\n请将此邀请码分享给您的伴侣');
        }

        // 更新关系显示状态
        function updateRelationshipDisplay() {
            const statusElement = document.getElementById('relationshipStatus');
            const dateElement = document.getElementById('relationshipDate');
            const actionsElement = document.getElementById('relationshipActions');

            if (isConnected) {
                statusElement.innerHTML = '💕 已与' + partnerName + '绑定';
                statusElement.className = 'relationship-status connected';
                dateElement.textContent = '在一起时间：' + formatDate(relationshipStartDate);
                actionsElement.innerHTML = `
                    <button class="btn-small secondary" onclick="editRelationshipDate()">修改日期</button>
                    <button class="btn-small danger" onclick="unbindRelationship()">解除绑定</button>
                `;
            } else {
                statusElement.innerHTML = '💔 暂未绑定情侣';
                statusElement.className = 'relationship-status disconnected';
                dateElement.textContent = '邀请您的伴侣一起使用吧';
                actionsElement.innerHTML = `
                    <button class="btn-small primary" onclick="inviteBind()">邀请绑定</button>
                `;
            }
        }

        // 格式化日期显示
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
        }

        // 关于我们
        function showAboutUs() {
            alert('关于一日三餐恋\n\n版本：1.0.0\n用爱记录每一餐，用心感受每一天');
        }

        // 意见反馈
        function showFeedback() {
            alert('意见反馈功能开发中...\n您可以通过邮箱联系我们：feedback@mealslove.com');
        }

        // 联系客服
        function contactService() {
            alert('客服联系方式：\n\n客服热线：400-123-4567\n工作时间：9:00-18:00\n客服邮箱：service@mealslove.com');
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                alert('已退出登录');
                // 这里可以添加实际的登出逻辑
            }
        }

        // 初始化页面
        updateRelationshipDisplay();
    </script>
</body>
</html>
