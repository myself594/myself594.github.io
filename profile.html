<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 禁止缓存的 Meta 标签 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>个人中心 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.04);
            --danger: #FF4757;
            --success: #2ECC71;
            --warning: #FFA726;
            --border-radius: 12px;
            --border-radius-small: 8px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
            position: relative;
        }
        
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 107, 139, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .settings-btn:hover {
            background-color: rgba(255, 107, 139, 0.2);
            transform: rotate(90deg);
        }
        
        .settings-btn.active {
            background-color: var(--primary);
            color: white;
        }
        
        .settings-btn.active:hover {
            background-color: #ff5577;
        }
        
        .profile-header {
            text-align: center;
            padding: 20px 0 30px;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 3px solid var(--primary);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .profile-avatar.editable {
            cursor: pointer;
        }
        
        .profile-avatar.editable:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 139, 0.3);
        }
        
        .profile-avatar.editable::after {
            content: '✏️';
            position: absolute;
            bottom: 0;
            right: 0;
            background: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: var(--shadow);
            opacity: 1;
            transition: all 0.3s ease;
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
        }
        
        .profile-name.editable {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--border-radius-small);
            background-color: rgba(255, 107, 139, 0.08);
        }
        
        .profile-name.editable:hover {
            background-color: rgba(255, 107, 139, 0.15);
            color: var(--primary);
        }
        
        .profile-name.editable::after {
            content: '点击修改';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 1;
            pointer-events: none;
        }
        
        .menu-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .menu-item {
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background-color: rgba(255, 107, 139, 0.04);
        }
        
        .menu-item.danger:hover {
            background-color: rgba(255, 71, 87, 0.04);
        }
        
        .menu-header {
            display: flex;
            align-items: center;
            padding: 16px 18px;
        }
        
        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius-small);
            background-color: rgba(255, 107, 139, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            color: var(--primary);
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .menu-text {
            flex: 1;
            font-weight: 600;
            font-size: 15px;
            color: var(--dark);
        }
        
        .menu-arrow {
            color: #ccc;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .menu-item.expanded .menu-arrow {
            transform: rotate(90deg);
            color: var(--primary);
        }
        
        .menu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: rgba(255, 107, 139, 0.02);
        }
        
        .menu-content.expanded {
            max-height: 300px;
        }
        
        .menu-sub-item {
            padding: 12px 18px 12px 60px;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: var(--dark);
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .menu-sub-item:hover {
            background-color: rgba(255, 107, 139, 0.06);
            color: var(--primary);
        }
        
        .menu-sub-item:first-child {
            border-top: none;
        }
        
        .menu-sub-icon {
            position: absolute;
            left: 20px;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: rgba(255, 107, 139, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--primary);
        }
        
        .menu-sub-text {
            flex: 1;
        }
        
        .menu-sub-status {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
        }
        
        .menu-sub-status.warning {
            color: var(--warning);
        }
        
        .menu-sub-status.success {
            color: var(--success);
        }
        
        .menu-item.danger .menu-icon {
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--danger);
        }
        
        .menu-item.danger .menu-text {
            color: var(--danger);
        }
        
        .menu-item.danger:hover .menu-arrow {
            color: var(--danger);
        }
        
        .status-indicator {
            font-size: 12px;
            color: #999;
            max-width: 120px;
            text-align: right;
            margin-right: 8px;
        }
        
        .status-indicator.connected {
            color: var(--success);
        }
        
        .status-indicator.warning {
            color: var(--warning);
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 50% auto;
            padding: 24px;
            border-radius: var(--border-radius);
            width: 85%;
            max-width: 350px;
            transform: translateY(-50%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            color: var(--dark);
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius-small);
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .modal-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 107, 139, 0.2);
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--border-radius-small);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn.primary {
            background-color: var(--primary);
            color: white;
        }
        
        .modal-btn.primary:hover {
            background-color: #ff5577;
        }
        
        .modal-btn.secondary {
            background-color: #f5f5f5;
            color: var(--dark);
        }
        
        .modal-btn.secondary:hover {
            background-color: #e0e0e0;
        }
        
        .modal-btn.danger {
            background-color: var(--danger);
            color: white;
        }
        
        .modal-btn.danger:hover {
            background-color: #e03e2b;
        }
        
        .modal-text {
            text-align: center;
            margin-bottom: 20px;
            color: var(--dark);
            line-height: 1.5;
        }
        
        .modal-text.warning {
            color: var(--warning);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 右上角设置按钮 -->
        <div class="settings-btn" onclick="toggleEditMode()" id="settingsBtn" title="编辑模式">
            ⚙️
        </div>
        
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">
                🐰
            </div>
            <div class="profile-name" id="userName">
                兔兔
            </div>
        </div>
        
        <div class="menu-container">
            <div class="menu-item" onclick="toggleMenu('relationship')">
                <div class="menu-header">
                    <div class="menu-icon">💕</div>
                    <div class="menu-text">情侣设置</div>
                    <div class="status-indicator connected" id="relationshipStatus">与熊大绑定</div>
                    <div class="menu-arrow">›</div>
                </div>
                <div class="menu-content" id="relationshipContent">
                    <div class="menu-sub-item" onclick="showDateModal()">
                        <div class="menu-sub-icon">📅</div>
                        <div class="menu-sub-text">修改在一起日期</div>
                        <div class="menu-sub-status" id="dateStatus">未设置</div>
                    </div>
                    <div class="menu-sub-item" id="bindAction" onclick="showBindModal()">
                        <div class="menu-sub-icon">🔗</div>
                        <div class="menu-sub-text">解除绑定</div>
                    </div>
                </div>
            </div>
            
            <div class="menu-item" onclick="showAnniversaryManager()">
                <div class="menu-header">
                    <div class="menu-icon">📅</div>
                    <div class="menu-text">纪念日管理</div>
                    <div class="menu-arrow">›</div>
                </div>
            </div>
            
            <div class="menu-item" onclick="showFeedback()">
                <div class="menu-header">
                    <div class="menu-icon">💬</div>
                    <div class="menu-text">意见反馈</div>
                    <div class="menu-arrow">›</div>
                </div>
            </div>
            
            <div class="menu-item" onclick="contactService()">
                <div class="menu-header">
                    <div class="menu-icon">🎧</div>
                    <div class="menu-text">联系客服</div>
                    <div class="menu-arrow">›</div>
                </div>
            </div>
            
            <div class="menu-item danger" onclick="logout()">
                <div class="menu-header">
                    <div class="menu-icon">🚪</div>
                    <div class="menu-text">退出登录</div>
                    <div class="menu-arrow">›</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改日期弹窗 -->
    <div id="dateModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">修改在一起日期</div>
            <div class="modal-text" id="currentDateText">当前未设置，点击设置</div>
            <input type="date" id="dateInput" class="modal-input" />
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeDateModal()">取消</button>
                <button class="modal-btn primary" onclick="confirmDateChange()">确认</button>
            </div>
        </div>
    </div>

    <!-- 绑定/解绑弹窗 -->
    <div id="bindModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="bindModalTitle">解除绑定</div>
            <div class="modal-text" id="bindModalText">确定要解除与熊大的绑定吗？解除后将无法查看共同记录。</div>
            <div class="modal-buttons" id="bindModalButtons">
                <button class="modal-btn secondary" onclick="closeBindModal()">取消</button>
                <button class="modal-btn danger" onclick="confirmUnbind()">确认解除</button>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据状态
        let isConnected = true;
        let partnerName = '熊大';
        let relationshipStartDate = null; // 初始化为null，表示未设置
        let userName = '兔兔';
        let partnerNickname = '熊大';
        let isEditMode = false; // 编辑模式状态

        // 切换编辑模式
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const settingsBtn = document.getElementById('settingsBtn');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileName = document.getElementById('userName');
            
            if (isEditMode) {
                // 进入编辑模式
                settingsBtn.classList.add('active');
                settingsBtn.title = '退出编辑';
                profileAvatar.classList.add('editable');
                profileName.classList.add('editable');
                
                // 添加点击事件
                profileAvatar.onclick = editMyAvatar;
                profileName.onclick = editMyNickname;
                profileAvatar.title = '点击修改头像';
                profileName.title = '点击修改昵称';
            } else {
                // 退出编辑模式
                settingsBtn.classList.remove('active');
                settingsBtn.title = '编辑模式';
                profileAvatar.classList.remove('editable');
                profileName.classList.remove('editable');
                
                // 移除点击事件
                profileAvatar.onclick = null;
                profileName.onclick = null;
                profileAvatar.removeAttribute('title');
                profileName.removeAttribute('title');
            }
        }

        // 手风琴菜单切换
        function toggleMenu(menuId) {
            const menuItem = document.querySelector(`#${menuId}Content`).parentElement;
            const content = document.getElementById(`${menuId}Content`);
            const arrow = menuItem.querySelector('.menu-arrow');
            
            // 关闭其他展开的菜单
            document.querySelectorAll('.menu-item').forEach(item => {
                if (item !== menuItem && item.classList.contains('expanded')) {
                    item.classList.remove('expanded');
                    const otherContent = item.querySelector('.menu-content');
                    const otherArrow = item.querySelector('.menu-arrow');
                    if (otherContent) {
                        otherContent.classList.remove('expanded');
                    }
                }
            });
            
            // 切换当前菜单
            menuItem.classList.toggle('expanded');
            content.classList.toggle('expanded');
            
            // 阻止事件冒泡
            event.stopPropagation();
        }

        // 显示修改日期弹窗
        function showDateModal() {
            if (!isConnected) {
                alert('请先绑定情侣关系');
                return;
            }
            
            const currentDateText = document.getElementById('currentDateText');
            const dateInput = document.getElementById('dateInput');
            
            if (relationshipStartDate) {
                // 如果已经设置了日期
                currentDateText.textContent = `当前日期：${formatDate(relationshipStartDate)}`;
                currentDateText.className = 'modal-text';
                dateInput.value = relationshipStartDate;
            } else {
                // 如果未设置日期
                currentDateText.textContent = '当前未设置，点击设置';
                currentDateText.className = 'modal-text warning';
                dateInput.value = '';
            }
            
            document.getElementById('dateModal').style.display = 'block';
            event.stopPropagation();
        }

        // 关闭修改日期弹窗
        function closeDateModal() {
            document.getElementById('dateModal').style.display = 'none';
        }

        // 确认修改日期
        function confirmDateChange() {
            const newDate = document.getElementById('dateInput').value;
            if (newDate) {
                const isFirstTime = !relationshipStartDate; // 判断是否为首次设置
                relationshipStartDate = newDate;
                
                if (isFirstTime) {
                    alert('在一起日期设置成功：' + formatDate(relationshipStartDate));
                } else {
                    alert('日期修改成功：' + formatDate(relationshipStartDate));
                }
                
                closeDateModal();
                updateBindStatus(); // 更新状态显示
            } else {
                alert('请选择日期');
            }
        }

        // 显示绑定/解绑弹窗
        function showBindModal() {
            const modal = document.getElementById('bindModal');
            const title = document.getElementById('bindModalTitle');
            const text = document.getElementById('bindModalText');
            const buttons = document.getElementById('bindModalButtons');
            
            if (isConnected) {
                title.textContent = '解除绑定';
                text.textContent = `确定要解除与${partnerName}的绑定吗？解除后将无法查看共同记录。`;
                buttons.innerHTML = `
                    <button class="modal-btn secondary" onclick="closeBindModal()">取消</button>
                    <button class="modal-btn danger" onclick="confirmUnbind()">确认解除</button>
                `;
            } else {
                title.textContent = '邀请绑定';
                const inviteCode = 'LOVE' + Math.random().toString(36).substr(2, 6).toUpperCase();
                text.textContent = `您的邀请码：${inviteCode}\n请将此邀请码分享给您的伴侣`;
                buttons.innerHTML = `
                    <button class="modal-btn primary" onclick="closeBindModal()">知道了</button>
                `;
            }
            
            modal.style.display = 'block';
            event.stopPropagation();
        }

        // 关闭绑定弹窗
        function closeBindModal() {
            document.getElementById('bindModal').style.display = 'none';
        }

        // 确认解除绑定
        function confirmUnbind() {
            isConnected = false;
            relationshipStartDate = null; // 解除绑定时清空日期
            updateBindStatus();
            closeBindModal();
            alert('已解除绑定');
        }

        // 更新绑定状态显示
        function updateBindStatus() {
            const statusElement = document.getElementById('relationshipStatus');
            const bindActionElement = document.getElementById('bindAction');
            const dateStatusElement = document.getElementById('dateStatus');
            
            if (isConnected) {
                if (relationshipStartDate) {
                    statusElement.textContent = `与${partnerName}绑定`;
                    statusElement.className = 'status-indicator connected';
                    dateStatusElement.textContent = formatDate(relationshipStartDate);
                    dateStatusElement.className = 'menu-sub-status success';
                } else {
                    statusElement.textContent = '日期未设置';
                    statusElement.className = 'status-indicator warning';
                    dateStatusElement.textContent = '未设置';
                    dateStatusElement.className = 'menu-sub-status warning';
                }
                bindActionElement.querySelector('.menu-sub-text').textContent = '解除绑定';
            } else {
                statusElement.textContent = '未绑定';
                statusElement.className = 'status-indicator';
                dateStatusElement.textContent = '未绑定';
                dateStatusElement.className = 'menu-sub-status';
                bindActionElement.querySelector('.menu-sub-text').textContent = '邀请绑定';
            }
        }

        // 修改我的昵称
        function editMyNickname(event) {
            if (event) event.stopPropagation();
            const newName = prompt('请输入新的昵称:', userName);
            if (newName && newName.trim()) {
                userName = newName.trim();
                document.getElementById('userName').textContent = userName;
                alert('昵称修改成功');
            }
        }

        // 修改对方昵称
        function editPartnerNickname(event) {
            if (event) event.stopPropagation();
            if (!isConnected) {
                alert('请先绑定情侣关系');
                return;
            }
            const newName = prompt('请输入对方的昵称:', partnerNickname);
            if (newName && newName.trim()) {
                partnerNickname = newName.trim();
                partnerName = partnerNickname; // 同步更新伴侣姓名
                updateBindStatus(); // 更新显示
                alert('对方昵称修改成功：' + partnerNickname);
            }
        }

        // 修改我的头像
        function editMyAvatar(event) {
            if (event) event.stopPropagation();
            alert('头像修改功能开发中...\n您可以选择表情符号或上传自定义头像');
        }

        // 修改对方头像
        function editPartnerAvatar(event) {
            if (event) event.stopPropagation();
            if (!isConnected) {
                alert('请先绑定情侣关系');
                return;
            }
            alert('对方头像修改功能开发中...\n您可以为对方设置专属头像');
        }

        // 纪念日管理
        function showAnniversaryManager() {
            alert('纪念日管理功能开发中...\n您可以在这里添加和管理重要的纪念日');
        }

        // 意见反馈
        function showFeedback() {
            alert('意见反馈功能开发中...\n您可以通过邮箱联系我们：feedback@mealslove.com');
        }

        // 联系客服
        function contactService() {
            alert('客服联系方式：\n\n客服热线：400-123-4567\n工作时间：9:00-18:00\n客服邮箱：service@mealslove.com');
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                alert('已退出登录');
                // 这里可以添加实际的登出逻辑
            }
        }

        // 格式化日期显示
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
        }

        // 初始化页面
        updateBindStatus();

        // 点击弹窗背景关闭弹窗
        window.onclick = function(event) {
            const dateModal = document.getElementById('dateModal');
            const bindModal = document.getElementById('bindModal');
            
            if (event.target === dateModal) {
                closeDateModal();
            }
            if (event.target === bindModal) {
                closeBindModal();
            }
        }
    </script>
