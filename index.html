<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --sidebar-width: 280px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            overflow: hidden;
            height: 100vh;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-align: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .logo-subtitle {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .nav-section {
            margin-bottom: 20px;
        }
        
        .nav-section-title {
            padding: 10px 20px;
            font-size: 12px;
            font-weight: bold;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--dark);
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border-left: 3px solid transparent;
            position: relative;
        }
        
        .nav-item:hover {
            background-color: rgba(255, 107, 139, 0.05);
            border-left-color: var(--primary);
        }
        
        .nav-item.active {
            background-color: rgba(255, 107, 139, 0.1);
            border-left-color: var(--primary);
            font-weight: 500;
        }
        
        .nav-item-icon {
            font-size: 20px;
            margin-right: 12px;
            width: 24px;
            text-align: center;
        }
        
        .nav-item-text {
            flex: 1;
            font-size: 14px;
        }
        
        .nav-item-badge {
            padding: 2px 8px;
            background-color: var(--primary);
            color: white;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .user-info:hover {
            background-color: #f0f0f0;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 10px;
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--dark);
        }
        
        .user-status {
            font-size: 11px;
            color: #999;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        
        .top-bar {
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }
        
        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--dark);
            margin-right: 15px;
        }
        
        .page-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark);
            flex: 1;
        }
        
        .top-actions {
            display: flex;
            gap: 15px;
        }
        
        .action-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.3);
        }
        
        .content-frame {
            flex: 1;
            border: none;
            background: white;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .menu-toggle {
                display: block;
            }
            
            .top-bar {
                padding: 0 15px;
            }
            
            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
            }
            
            .overlay.show {
                display: block;
            }
        }
        
        /* 加载动画 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .loading-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">一日三餐恋</div>
                <div class="logo-subtitle">记录美好时光 💕</div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">核心功能</div>
                    <a class="nav-item active" data-page="home.html">
                        <span class="nav-item-icon">🏠</span>
                        <span class="nav-item-text">首页</span>
                    </a>
                    <a class="nav-item" data-page="add-record.html">
                        <span class="nav-item-icon">➕</span>
                        <span class="nav-item-text">添加记录</span>
                    </a>
                    <a class="nav-item" data-page="records.html">
                        <span class="nav-item-icon">📝</span>
                        <span class="nav-item-text">用餐记录</span>
                        <span class="nav-item-badge">42</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">情侣专属</div>
                    <a class="nav-item" data-page="anniversary.html">
                        <span class="nav-item-icon">🎉</span>
                        <span class="nav-item-text">纪念日管理</span>
                        <span class="nav-item-badge">4</span>
                    </a>
                    <a class="nav-item" data-page="add-anniversary.html">
                        <span class="nav-item-icon">📅</span>
                        <span class="nav-item-text">添加纪念日</span>
                    </a>
                    <a class="nav-item" data-page="recipes.html">
                        <span class="nav-item-icon">📖</span>
                        <span class="nav-item-text">情侣菜谱</span>
                        <span class="nav-item-badge">15</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">数据分析</div>
                    <a class="nav-item" data-page="stats.html">
                        <span class="nav-item-icon">📊</span>
                        <span class="nav-item-text">数据统计</span>
                    </a>
                    <a class="nav-item" data-page="journey.html">
                        <span class="nav-item-icon">🗺️</span>
                        <span class="nav-item-text">美食轨迹</span>
                        <span class="nav-item-badge">8</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">个人中心</div>
                    <a class="nav-item" data-page="profile.html">
                        <span class="nav-item-icon">👤</span>
                        <span class="nav-item-text">个人中心</span>
                    </a>
                    <a class="nav-item" data-page="settings.html">
                        <span class="nav-item-icon">⚙️</span>
                        <span class="nav-item-text">个人设置</span>
                    </a>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info" onclick="navigateTo('profile.html')">
                    <div class="user-avatar">🐰</div>
                    <div class="user-details">
                        <div class="user-name">兔兔</div>
                        <div class="user-status">在一起 128 天</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <div class="top-bar">
                <div class="menu-toggle" id="menuToggle">☰</div>
                <div class="page-title" id="pageTitle">首页</div>
                <div class="top-actions">
                    <button class="action-btn" onclick="navigateTo('add-record.html')">
                        <span>➕</span>
                        <span>添加记录</span>
                    </button>
                </div>
            </div>
            
            <div style="position: relative; flex: 1;">
                <iframe id="contentFrame" class="content-frame" src="home.html"></iframe>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 移动端遮罩层 -->
    <div class="overlay" id="overlay"></div>
    
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menuToggle');
        const contentFrame = document.getElementById('contentFrame');
        const pageTitle = document.getElementById('pageTitle');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const navItems = document.querySelectorAll('.nav-item');
        
        // 页面标题映射
        const pageTitles = {
            'home.html': '首页',
            'add-record.html': '添加记录',
            'records.html': '用餐记录',
            'anniversary.html': '纪念日管理',
            'add-anniversary.html': '添加纪念日',
            'recipes.html': '情侣菜谱',
            'stats.html': '数据统计',
            'journey.html': '美食轨迹',
            'profile.html': '个人中心',
            'settings.html': '个人设置'
        };
        
        // 导航到指定页面
        function navigateTo(page) {
            // 显示加载动画
            loadingOverlay.classList.add('show');
            
            // 更新 iframe 源
            contentFrame.src = page;
            
            // 更新页面标题
            pageTitle.textContent = pageTitles[page] || '一日三餐恋';
            
            // 更新导航项激活状态
            navItems.forEach(item => {
                if (item.getAttribute('data-page') === page) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            // 移动端关闭侧边栏
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        }
        
        // iframe 加载完成
        contentFrame.addEventListener('load', function() {
            // 隐藏加载动画
            setTimeout(() => {
                loadingOverlay.classList.remove('show');
            }, 300);
        });
        
        // 导航项点击事件
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                navigateTo(page);
            });
        });
        
        // 移动端菜单切换
        menuToggle.addEventListener('click', function() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        });
        
        // 点击遮罩层关闭侧边栏
        overlay.addEventListener('click', function() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });
        
        // 监听窗口大小变化
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        });
        
        // 初始化：显示加载动画
        window.addEventListener('load', function() {
            loadingOverlay.classList.add('show');
        });
    </script>
</body>
</html>
