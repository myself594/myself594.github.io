<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>情侣菜谱 - 一日三餐</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding-bottom: 30px;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 30px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
        }
        
        /* 添加菜谱卡片 */
        .add-recipe-card {
            background: linear-gradient(135deg, rgba(255, 107, 139, 0.05), rgba(255, 160, 122, 0.05));
            border-radius: 12px;
            padding: 18px 20px;
            position: relative;
            border: 1.5px solid rgba(255, 107, 139, 0.2);
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .add-recipe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.15);
            border-color: rgba(255, 107, 139, 0.4);
        }
        
        .add-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 300;
        }
        
        .add-content {
            flex: 1;
        }
        
        .add-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 2px;
        }
        
        .add-description {
            font-size: 12px;
            color: #999;
        }
        
        .add-arrow {
            font-size: 16px;
            color: var(--primary);
        }
        
        /* 筛选标签 */
        .recipes-tabs {
            display: flex;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        
        .recipes-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .recipes-tab {
            flex: 1;
            min-width: fit-content;
            text-align: center;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .recipes-tab.active {
            background-color: white;
            box-shadow: var(--shadow);
            color: var(--primary);
        }
        
        /* 菜谱列表 */
        .recipes-container {
            display: grid;
            gap: 20px;
        }
        
        .recipe-card {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        
        .recipe-image-container {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
            border-radius: 20px 20px 0 0;
        }
        
        .recipe-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .recipe-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #ccc;
        }
        
        .recipe-difficulty-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            z-index: 2;
        }
        
        .recipe-pinned-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            background: rgba(255, 209, 102, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            z-index: 3;
        }
        
        .recipe-menu-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
            color: var(--dark);
        }
        
        .recipe-menu-btn:hover {
            background: white;
            transform: scale(1.05);
        }
        
        .recipe-menu-dropdown {
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            min-width: 160px;
            z-index: 10000;
            display: none;
        }
        
        .recipe-menu-dropdown.show {
            display: block;
            animation: slideDown 0.2s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .recipe-menu-item {
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--dark);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            white-space: nowrap;
        }
        
        .recipe-menu-item span:first-child {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        .recipe-menu-item:last-child {
            border-bottom: none;
        }
        
        .recipe-menu-item:hover {
            background-color: rgba(255, 107, 139, 0.05);
            color: var(--primary);
        }
        
        .recipe-menu-item.delete:hover {
            background-color: #ffebee;
            color: #ff5252;
        }
        
        .recipe-content {
            padding: 15px;
        }
        
        .recipe-header {
            margin-bottom: 10px;
        }
        
        .recipe-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
            flex: 1;
            line-height: 1.3;
        }
        
        .recipe-preview {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        
        .recipe-preview strong {
            color: var(--dark);
            font-weight: 600;
        }
        
        .recipe-steps-preview {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        
        .recipe-steps-preview strong {
            color: var(--dark);
            font-weight: 600;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .empty-text {
            font-size: 16px;
            margin-bottom: 10px;
            color: #666;
        }
        
        .empty-hint {
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 分类标签 -->
        <div class="recipes-tabs">
            <div class="recipes-tab active" data-filter="all">全部</div>
            <div class="recipes-tab" data-filter="早餐">早餐</div>
            <div class="recipes-tab" data-filter="午餐">午餐</div>
            <div class="recipes-tab" data-filter="晚餐">晚餐</div>
        </div>
        
        <!-- 添加菜谱卡片 -->
        <div class="add-recipe-card" id="addRecipeBtn">
            <div class="add-icon">+</div>
            <div class="add-content">
                <div class="add-title">添加菜谱</div>
                <div class="add-description">记录你们的美食时光</div>
            </div>
            <div class="add-arrow">→</div>
        </div>
        
        <!-- 菜谱列表 -->
        <div class="recipes-container" id="recipesContainer"></div>
    </div>
    
    <script>
        // 初始数据
        const recipesData = [
            {
                id: 1,
                name: '爱心煎蛋三明治',
                image: null,
                cook: 'together',
                cookLabel: '👩‍🍳👨‍🍳 一起',
                time: 15,
                pinned: false,
                ingredients: ['吐司面包 2片', '鸡蛋 2个', '火腿 2片', '生菜 2片', '番茄 1片', '芝士 1片', '黄油 适量', '盐 少许'],
                steps: [
                    '将吐司面包片放入烤面包机中烤至金黄色',
                    '在平底锅中融化黄油，打入鸡蛋，煎至蛋白凝固',
                    '将火腿片稍微煎一下，增加香味',
                    '在吐司上依次放上生菜、番茄、火腿、芝士和煎蛋',
                    '盖上另一片吐司，对角切开即可'
                ],
                tags: ['早餐'],
                notes: '熊大最爱的早餐，鸡蛋煎成爱心形状更有爱💕'
            },
            {
                id: 2,
                name: '自制火锅',
                image: null,
                cook: 'together',
                cookLabel: '👩‍🍳👨‍🍳 一起',
                time: 30,
                pinned: true,
                ingredients: ['火锅底料 1包', '牛肉片 200g', '羊肉片 200g', '虾 150g', '豆腐 1块', '金针菇 150g', '白菜 适量', '粉丝 1把'],
                steps: [
                    '准备好所有食材，肉类提前解冻',
                    '锅中加水烧开，放入火锅底料',
                    '待底料融化后，依次放入各类食材',
                    '煮熟后即可食用，配上调料更美味'
                ],
                tags: ['晚餐'],
                notes: '周末在家的最爱，暖心又暖胃'
            },
            {
                id: 3,
                name: '番茄炒蛋',
                image: null,
                cook: 'rabbit',
                cookLabel: '👩‍🍳 兔兔',
                time: 10,
                pinned: false,
                ingredients: ['番茄 2个', '鸡蛋 3个', '葱 少许', '盐 适量', '糖 少许', '油 适量'],
                steps: [
                    '番茄洗净切块，鸡蛋打散',
                    '锅中放油，炒熟鸡蛋后盛出',
                    '另起锅炒番茄，加盐和糖',
                    '番茄出汁后倒入鸡蛋，翻炒均匀',
                    '撒上葱花即可出锅'
                ],
                tags: ['午餐'],
                notes: '兔兔的拿手菜，酸甜可口'
            }
        ];
        
        let currentFilter = 'all';
        let currentRecipes = [...recipesData];
        
        // 渲染菜谱列表
        function renderRecipes(recipes) {
            const container = document.getElementById('recipesContainer');
            
            if (recipes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📖</div>
                        <div class="empty-text">还没有菜谱哦</div>
                        <div class="empty-hint">点击右下角"+"按钮添加第一个菜谱</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = recipes.map(recipe => `
                <div class="recipe-card" data-id="${recipe.id}">
                    <div class="recipe-image-container">
                        ${recipe.image ? 
                            `<img src="${recipe.image}" alt="${recipe.name}" class="recipe-image">` :
                            `<div class="recipe-image-placeholder">📷</div>`
                        }
                        ${recipe.pinned ? `
                        <div class="recipe-pinned-badge">
                            ⭐ 置顶
                        </div>
                        ` : ''}
                        ${recipe.tags.length > 0 ? `
                        <div class="recipe-difficulty-badge" style="${recipe.pinned ? 'left: 95px;' : ''}">
                            ${recipe.tags[0]}
                        </div>
                        ` : ''}
                        <div class="recipe-menu-btn" data-id="${recipe.id}">
                            ⋮
                        </div>
                    </div>
                    <div class="recipe-content">
                        <div class="recipe-header">
                            <div class="recipe-title">${recipe.name}</div>
                        </div>
                        <div class="recipe-preview" style="margin-top: 12px; margin-bottom: 10px;">
                            <strong>食材：</strong>${recipe.ingredients.slice(0, 3).join('、')}${recipe.ingredients.length > 3 ? '...' : ''}
                        </div>
                        ${recipe.steps && recipe.steps.length > 0 ? `
                        <div class="recipe-steps-preview">
                            <strong>步骤：</strong>
                            <ol style="margin: 8px 0 0 20px; padding: 0; font-size: 13px; color: #666; line-height: 1.6;">
                                ${recipe.steps.slice(0, 3).map(step => `<li style="margin-bottom: 5px;">${step}</li>`).join('')}
                                ${recipe.steps.length > 3 ? '<li style="color: #999;">...</li>' : ''}
                            </ol>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
            
            // 在body末尾添加所有菜单下拉框（避免被裁剪）
            const existingMenus = document.querySelectorAll('.recipe-menu-dropdown');
            existingMenus.forEach(menu => menu.remove());
            
            recipes.forEach(recipe => {
                const dropdown = document.createElement('div');
                dropdown.className = 'recipe-menu-dropdown';
                dropdown.dataset.recipeId = recipe.id;
                dropdown.innerHTML = `
                    <div class="recipe-menu-item" data-action="pin" data-id="${recipe.id}">
                        <span>📌</span>
                        <span>${recipe.pinned ? '取消置顶' : '置顶菜谱'}</span>
                    </div>
                    <div class="recipe-menu-item" data-action="edit" data-id="${recipe.id}">
                        <span>✏️</span>
                        <span>编辑菜谱</span>
                    </div>
                    <div class="recipe-menu-item" data-action="share" data-id="${recipe.id}">
                        <span>📤</span>
                        <span>分享菜谱</span>
                    </div>
                    <div class="recipe-menu-item delete" data-action="delete" data-id="${recipe.id}">
                        <span>🗑️</span>
                        <span>删除菜谱</span>
                    </div>
                `;
                document.body.appendChild(dropdown);
            });
            
            // 绑定菜单按钮事件
            document.querySelectorAll('.recipe-menu-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    const recipeId = this.dataset.id;
                    const dropdown = document.querySelector(`.recipe-menu-dropdown[data-recipe-id="${recipeId}"]`);
                    
                    // 关闭其他打开的菜单
                    document.querySelectorAll('.recipe-menu-dropdown').forEach(d => {
                        if (d !== dropdown) {
                            d.classList.remove('show');
                        }
                    });
                    
                    // 切换当前菜单
                    if (dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    } else {
                        // 计算菜单位置
                        const btnRect = this.getBoundingClientRect();
                        dropdown.style.top = (btnRect.bottom + 5) + 'px';
                        dropdown.style.left = (btnRect.right - 160) + 'px';
                        dropdown.classList.add('show');
                    }
                });
            });
            
            // 绑定菜单项事件
            document.querySelectorAll('.recipe-menu-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    const id = parseInt(this.dataset.id);
                    
                    // 关闭菜单
                    document.querySelectorAll('.recipe-menu-dropdown').forEach(d => d.classList.remove('show'));
                    
                    // 执行操作
                    handleRecipeAction(action, id);
                });
            });
            
            // 绑定卡片点击事件
            document.querySelectorAll('.recipe-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    // 如果点击的是菜单按钮，不触发查看详情
                    if (e.target.closest('.recipe-menu-btn')) {
                        return;
                    }
                    const id = parseInt(this.dataset.id);
                    viewRecipeDetail(id);
                });
            });
        }
        
        // 处理菜单操作
        function handleRecipeAction(action, id) {
            const recipe = recipesData.find(r => r.id === id);
            if (!recipe) return;
            
            switch(action) {
                case 'pin':
                    togglePin(id);
                    break;
                case 'edit':
                    editRecipe(id);
                    break;
                case 'share':
                    shareRecipe(id);
                    break;
                case 'delete':
                    deleteRecipe(id);
                    break;
            }
        }
        
        // 置顶/取消置顶
        function togglePin(id) {
            const recipe = recipesData.find(r => r.id === id);
            if (recipe) {
                recipe.pinned = !recipe.pinned;
                filterRecipes(currentFilter);
                alert(recipe.pinned ? `"${recipe.name}"已置顶` : `已取消置顶"${recipe.name}"`);
            }
        }
        
        // 分享菜谱
        function shareRecipe(id) {
            const recipe = recipesData.find(r => r.id === id);
            if (recipe) {
                alert(`分享菜谱：${recipe.name}\n\n可以分享给好友或生成分享链接`);
            }
        }
        
        // 编辑菜谱
        function editRecipe(id) {
            const recipe = recipesData.find(r => r.id === id);
            if (recipe) {
                alert(`编辑菜谱：${recipe.name}\n\n打开编辑表单功能（可复用添加菜谱的模态框）`);
            }
        }
        
        // 删除菜谱
        function deleteRecipe(id) {
            const recipe = recipesData.find(r => r.id === id);
            if (recipe) {
                if (confirm(`确定要删除菜谱"${recipe.name}"吗？`)) {
                    const index = recipesData.findIndex(r => r.id === id);
                    if (index > -1) {
                        recipesData.splice(index, 1);
                        filterRecipes(currentFilter);
                        alert('菜谱已删除');
                    }
                }
            }
        }
        
        // 查看菜谱详情
        function viewRecipeDetail(id) {
            const recipe = recipesData.find(r => r.id === id);
            if (recipe) {
                let detailText = `查看菜谱详情：${recipe.name}\n\n`;
                detailText += `食材清单：\n${recipe.ingredients.join('\n')}\n\n`;
                if (recipe.steps && recipe.steps.length > 0) {
                    detailText += `制作步骤：\n${recipe.steps.map((s, i) => `${i + 1}. ${s}`).join('\n')}\n\n`;
                }
                if (recipe.notes) {
                    detailText += `备注：${recipe.notes}`;
                }
                alert(detailText);
            }
        }
        
        // 筛选菜谱
        function filterRecipes(filter) {
            currentFilter = filter;
            
            let filtered = recipesData;
            
            // 按用餐时间筛选
            if (filter !== 'all') {
                filtered = filtered.filter(r => r.tags.includes(filter));
            }
            
            // 置顶的菜谱排在前面
            filtered.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return 0;
            });
            
            currentRecipes = filtered;
            renderRecipes(filtered);
        }
        
        // 标签切换
        document.querySelectorAll('.recipes-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.recipes-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                filterRecipes(this.dataset.filter);
            });
        });
        
        // 添加菜谱按钮 - 跳转到添加页面
        document.getElementById('addRecipeBtn').addEventListener('click', () => {
            // 跳转到添加菜谱页面
            window.location.href = 'add-recipe.html';
        });
        
        // 初始化
        renderRecipes(recipesData);
        
        // 点击其他地方关闭菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.recipe-menu-btn') && !e.target.closest('.recipe-menu-dropdown')) {
                document.querySelectorAll('.recipe-menu-dropdown').forEach(dropdown => {
                    dropdown.classList.remove('show');
                });
            }
        });
    </script>
</body>
</html>
