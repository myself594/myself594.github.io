<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>用餐记录 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .back-btn {
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }
        
        .back-btn:hover {
            color: var(--primary);
        }
        
        /* 筛选区域 */
        .filters-wrapper {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        
        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .filter-row:last-child {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            min-width: 60px;
        }
        
        .filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .filter-chip {
            padding: 8px 16px;
            background: #f5f5f5;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            font-weight: 500;
        }
        
        .filter-chip:hover {
            background: #ebebeb;
            border-color: var(--primary);
            color: var(--dark);
        }
        
        .filter-chip.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: white;
            box-shadow: 0 2px 8px rgba(255, 107, 139, 0.3);
        }
        
        .filter-selects {
            display: flex;
            gap: 8px;
            flex: 1;
        }
        
        .filter-select {
            flex: 1;
            padding: 8px 30px 8px 12px;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            font-size: 13px;
            background-color: #f5f5f5;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px;
            font-weight: 500;
        }
        
        .filter-select:hover {
            border-color: var(--primary);
            background-color: white;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(255, 107, 139, 0.1);
        }
        
        .reset-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            color: #666;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .reset-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        /* 记录列表 */
        .meals-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .meal-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        
        .meal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        .meal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }
        
        .meal-image-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
            position: relative;
        }
        
        .meal-carousel {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }
        
        .meal-image {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 2;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .carousel-dot.active {
            width: 20px;
            border-radius: 4px;
            background-color: white;
        }
        
        .meal-image-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        
        .meal-time-badge {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .meal-type-badge {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #666;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .meal-date-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: var(--dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }
        
        .meal-card-content {
            padding: 20px;
        }
        
        .meal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .meal-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #888;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        
        .meal-info-icon {
            font-size: 16px;
        }
        
        .meal-anniversary-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.15), rgba(255, 160, 122, 0.15));
            border-left: 3px solid #FFD166;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #e67e00;
            font-weight: 500;
        }
        
        .meal-recipe-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(139, 195, 74, 0.1));
            border-left: 3px solid #4CAF50;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #2e7d32;
            font-weight: 500;
        }
        
        .meal-tags-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .meal-notes {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255, 107, 139, 0.03), rgba(255, 160, 122, 0.03));
            border-radius: 12px;
            border-left: 3px solid var(--primary);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .empty-text {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .empty-hint {
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">用餐记录</div>
            <div class="back-btn" onclick="history.back()">←</div>
        </div>
        
        <!-- 筛选区域 -->
        <div class="filters-wrapper">
            <div class="filter-row">
                <div class="filter-label">时间</div>
                <div class="filter-chips">
                    <button class="filter-chip active" data-filter="time" data-value="all">全部</button>
                    <button class="filter-chip" data-filter="time" data-value="today">今天</button>
                    <button class="filter-chip" data-filter="time" data-value="week">本周</button>
                    <button class="filter-chip" data-filter="time" data-value="month">本月</button>
                </div>
            </div>
            
            <div class="filter-row">
                <div class="filter-label">时段</div>
                <div class="filter-chips">
                    <button class="filter-chip active" data-filter="mealtime" data-value="all">全部</button>
                    <button class="filter-chip" data-filter="mealtime" data-value="breakfast">早餐</button>
                    <button class="filter-chip" data-filter="mealtime" data-value="lunch">午餐</button>
                    <button class="filter-chip" data-filter="mealtime" data-value="dinner">晚餐</button>
                </div>
            </div>
            
            <div class="filter-row">
                <div class="filter-label">方式</div>
                <div class="filter-chips">
                    <button class="filter-chip active" data-filter="type" data-value="all">全部</button>
                    <button class="filter-chip" data-filter="type" data-value="home">在家</button>
                    <button class="filter-chip" data-filter="type" data-value="out">外出</button>
                </div>
            </div>
            
            <div class="filter-row">
                <div class="filter-label">更多</div>
                <div class="filter-selects">
                    <select class="filter-select" id="recipeFilter">
                        <option value="all">菜谱筛选</option>
                    </select>
                    <select class="filter-select" id="anniversaryFilter">
                        <option value="all">纪念日筛选</option>
                    </select>
                    <button class="reset-btn" id="resetBtn">重置</button>
                </div>
            </div>
        </div>
        
        <!-- 记录列表 -->
        <div class="meals-list" id="mealsList"></div>
    </div>
    
    <script>
        // 数据
        const recordsData = [
            {
                id: 1,
                title: '爱心煎蛋三明治',
                date: '10月12日',
                fullDate: '2024-10-12',
                time: '早餐',
                timeType: 'breakfast',
                type: '🏠 在家烹饪',
                typeCategory: 'home',
                cook: '👩‍🍳👨‍🍳 一起下厨',
                notes: '兔兔今天早起做的爱心早餐，搭配新鲜牛奶，熊大特别喜欢吃。吐司烤得刚刚好，鸡蛋煎成了爱心形状💕',
                images: [
                    'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400&h=220&fit=crop',
                    'https://images.unsplash.com/photo-1482049016688-2d3e1b311543?w=400&h=220&fit=crop'
                ],
                anniversary: null,
                recipes: ['爱心煎蛋三明治', '法式吐司']
            },
            {
                id: 2,
                title: '公司附近新开的日料',
                date: '10月12日',
                fullDate: '2024-10-12',
                time: '午餐',
                timeType: 'lunch',
                type: '🍽️ 外出就餐',
                typeCategory: 'out',
                location: '📍 北京市朝阳区 · 日料店',
                notes: '午休时间一起探索新店，三文鱼很新鲜，环境也很不错。店员服务态度特别好，下次还想来试试他们的招牌寿司。',
                images: [
                    'https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=400&h=220&fit=crop',
                    'https://images.unsplash.com/photo-1563612116625-3012372fccce?w=400&h=220&fit=crop'
                ],
                anniversary: null,
                recipes: null
            },
            {
                id: 3,
                title: '情人节特别晚餐',
                date: '10月10日',
                fullDate: '2024-10-10',
                time: '晚餐',
                timeType: 'dinner',
                type: '🏠 在家烹饪',
                typeCategory: 'home',
                cook: '👩‍🍳👨‍🍳 一起下厨',
                notes: '为了庆祝情人节，我们精心准备了烛光晚餐。从超市买了新鲜的牛排和红酒，一起动手做了一顿浪漫大餐。',
                images: [
                    'https://images.unsplash.com/photo-1544025162-d76694265947?w=400&h=220&fit=crop',
                    'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&h=220&fit=crop',
                    'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=220&fit=crop'
                ],
                anniversary: '💖 在一起100天',
                recipes: ['煎牛排', '凯撒沙拉', '提拉米苏']
            },
            {
                id: 4,
                title: '周年纪念牛排大餐',
                date: '9月20日',
                fullDate: '2024-09-20',
                time: '晚餐',
                timeType: 'dinner',
                type: '🏠 在家烹饪',
                typeCategory: 'home',
                cook: '👨‍🍳 TA下厨',
                notes: '熊大特意学习了煎牛排的技巧，为我们的周年纪念准备的惊喜晚餐。牛排五分熟恰到好处！',
                images: [
                    'https://images.unsplash.com/photo-1558030006-450675393462?w=400&h=220&fit=crop'
                ],
                anniversary: '💖 在一起100天',
                recipes: ['煎牛排', '奶油蘑菇汤']
            },
            {
                id: 5,
                title: '生日蛋糕甜品',
                date: '10月7日',
                fullDate: '2024-10-07',
                time: '晚餐',
                timeType: 'dinner',
                type: '🏠 在家烹饪',
                typeCategory: 'home',
                cook: '👩‍🍳👨‍🍳 一起下厨',
                notes: '兔兔的生日，我们一起做了提拉米苏，虽然有点歪但充满了爱意❤️',
                images: [
                    'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=400&h=220&fit=crop'
                ],
                anniversary: '🎂 兔兔生日',
                recipes: ['提拉米苏']
            }
        ];
        
        // 全局变量
        let filteredData = [...recordsData];
        const carousels = {};
        const filters = {
            time: 'all',
            mealtime: 'all',
            type: 'all',
            recipe: 'all',
            anniversary: 'all'
        };
        
        // 初始化
        function init() {
            initFilters();
            renderRecords();
        }
        
        // 初始化筛选选项
        function initFilters() {
            // 提取菜谱
            const recipes = new Set();
            recordsData.forEach(record => {
                if (record.recipes) {
                    record.recipes.forEach(r => recipes.add(r));
                }
            });
            
            const recipeSelect = document.getElementById('recipeFilter');
            recipes.forEach(recipe => {
                const option = document.createElement('option');
                option.value = recipe;
                option.textContent = recipe;
                recipeSelect.appendChild(option);
            });
            
            // 提取纪念日
            const anniversaries = new Set();
            recordsData.forEach(record => {
                if (record.anniversary) {
                    anniversaries.add(record.anniversary);
                }
            });
            
            const anniversarySelect = document.getElementById('anniversaryFilter');
            anniversaries.forEach(anniversary => {
                const option = document.createElement('option');
                option.value = anniversary;
                option.textContent = anniversary;
                anniversarySelect.appendChild(option);
            });
            
            // 绑定事件
            bindFilterEvents();
        }
        
        // 绑定筛选事件
        function bindFilterEvents() {
            // 按钮筛选
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const filterType = this.dataset.filter;
                    const value = this.dataset.value;
                    
                    // 更新按钮状态
                    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(c => {
                        c.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    // 更新筛选条件
                    filters[filterType] = value;
                    applyFilters();
                });
            });
            
            // 下拉框筛选
            document.getElementById('recipeFilter').addEventListener('change', function() {
                filters.recipe = this.value;
                applyFilters();
            });
            
            document.getElementById('anniversaryFilter').addEventListener('change', function() {
                filters.anniversary = this.value;
                applyFilters();
            });
            
            // 重置按钮
            document.getElementById('resetBtn').addEventListener('click', function() {
                // 重置所有筛选
                filters.time = 'all';
                filters.mealtime = 'all';
                filters.type = 'all';
                filters.recipe = 'all';
                filters.anniversary = 'all';
                
                // 重置UI
                document.querySelectorAll('.filter-chip').forEach(chip => {
                    chip.classList.toggle('active', chip.dataset.value === 'all');
                });
                document.getElementById('recipeFilter').value = 'all';
                document.getElementById('anniversaryFilter').value = 'all';
                
                applyFilters();
            });
        }
        
        // 应用筛选
        function applyFilters() {
            // 清除轮播
            Object.values(carousels).forEach(c => {
                if (c.interval) clearInterval(c.interval);
            });
            Object.keys(carousels).forEach(k => delete carousels[k]);
            
            // 筛选数据
            filteredData = recordsData.filter(record => {
                // 时间筛选
                if (filters.time !== 'all') {
                    const now = new Date();
                    const recordDate = new Date(record.fullDate);
                    
                    if (filters.time === 'today') {
                        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        if (recordDate < today) return false;
                    } else if (filters.time === 'week') {
                        const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                        if (recordDate < weekAgo) return false;
                    } else if (filters.time === 'month') {
                        const monthAgo = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
                        if (recordDate < monthAgo) return false;
                    }
                }
                
                // 时段筛选
                if (filters.mealtime !== 'all' && record.timeType !== filters.mealtime) {
                    return false;
                }
                
                // 方式筛选
                if (filters.type !== 'all' && record.typeCategory !== filters.type) {
                    return false;
                }
                
                // 菜谱筛选
                if (filters.recipe !== 'all') {
                    if (!record.recipes || !record.recipes.includes(filters.recipe)) {
                        return false;
                    }
                }
                
                // 纪念日筛选
                if (filters.anniversary !== 'all' && record.anniversary !== filters.anniversary) {
                    return false;
                }
                
                return true;
            });
            
            renderRecords();
        }
        
        // 渲染记录
        function renderRecords() {
            const container = document.getElementById('mealsList');
            container.innerHTML = '';
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div class="empty-text">暂无符合条件的记录</div>
                        <div class="empty-hint">试试调整筛选条件</div>
                    </div>
                `;
                return;
            }
            
            filteredData.forEach((meal, index) => {
                const card = createMealCard(meal, index);
                container.appendChild(card);
            });
            
            initCarousels();
        }
        
        // 创建卡片
        function createMealCard(meal, index) {
            const card = document.createElement('div');
            card.className = 'meal-card';
            
            let imagesHTML = '';
            if (meal.images && meal.images.length > 0) {
                imagesHTML = meal.images.map(img => 
                    `<img src="${img}" alt="${meal.title}" class="meal-image" loading="lazy">`
                ).join('');
            } else {
                imagesHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;color:#ccc;">📷</div>';
            }
            
            let dotsHTML = '';
            if (meal.images && meal.images.length > 1) {
                dotsHTML = `
                    <div class="carousel-dots">
                        ${meal.images.map((_, i) => 
                            `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
                        ).join('')}
                    </div>
                `;
            }
            
            let tagsHTML = '';
            if (meal.anniversary || (meal.recipes && meal.recipes.length > 0)) {
                tagsHTML = '<div class="meal-tags-container">';
                
                if (meal.anniversary) {
                    tagsHTML += `
                        <div class="meal-anniversary-tag">
                            <span>🎉</span>
                            <span>关联纪念日：${meal.anniversary}</span>
                        </div>
                    `;
                }
                
                if (meal.recipes && meal.recipes.length > 0) {
                    const recipesText = meal.recipes.join('、');
                    tagsHTML += `
                        <div class="meal-recipe-tag">
                            <span>📖</span>
                            <span>菜谱：${recipesText}</span>
                        </div>
                    `;
                }
                
                tagsHTML += '</div>';
            }
            
            card.innerHTML = `
                <div class="meal-image-container">
                    <div class="meal-carousel" data-carousel="${index}">
                        ${imagesHTML}
                    </div>
                    ${dotsHTML}
                    <div class="meal-image-overlay">
                        <div class="meal-time-badge">${meal.time}</div>
                        <div class="meal-type-badge">${meal.type}</div>
                    </div>
                    <div class="meal-date-badge">${meal.date}</div>
                </div>
                <div class="meal-card-content">
                    <div class="meal-title">${meal.title}</div>
                    <div class="meal-info">
                        <span class="meal-info-icon">${meal.cook || meal.location}</span>
                    </div>
                    ${tagsHTML}
                    <div class="meal-notes">${meal.notes}</div>
                </div>
            `;
            
            card.addEventListener('click', () => {
                alert(`查看记录详情：${meal.title}`);
            });
            
            return card;
        }
        
        // 初始化轮播
        function initCarousels() {
            filteredData.forEach((meal, index) => {
                if (meal.images && meal.images.length > 1) {
                    carousels[index] = {
                        currentIndex: 0,
                        totalImages: meal.images.length,
                        interval: setInterval(() => {
                            carousels[index].currentIndex = (carousels[index].currentIndex + 1) % carousels[index].totalImages;
                            updateCarousel(index);
                        }, 3000)
                    };
                }
            });
        }
        
        // 更新轮播
        function updateCarousel(index) {
            const carousel = carousels[index];
            const element = document.querySelector(`[data-carousel="${index}"]`);
            if (!element) return;
            
            element.style.transform = `translateX(-${carousel.currentIndex * 100}%)`;
            
            const dots = element.parentElement.querySelectorAll('.carousel-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === carousel.currentIndex);
            });
        }
        
        // 轮播点击事件
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('carousel-dot')) {
                const container = e.target.closest('.meal-image-container');
                const carouselEl = container.querySelector('.meal-carousel');
                const index = parseInt(carouselEl.dataset.carousel);
                const dotIndex = parseInt(e.target.dataset.index);
                
                if (carousels[index]) {
                    clearInterval(carousels[index].interval);
                    carousels[index].currentIndex = dotIndex;
                    updateCarousel(index);
                    carousels[index].interval = setInterval(() => {
                        carousels[index].currentIndex = (carousels[index].currentIndex + 1) % carousels[index].totalImages;
                        updateCarousel(index);
                    }, 3000);
                }
            }
        });
        
        // 启动
        init();
    </script>
</body>
</html>
