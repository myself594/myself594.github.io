<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加纪念日 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }
        
        .required-label:after {
            content: " *";
            color: #ff5252;
        }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background-color: #f9f9f9;
            transition: all 0.3s;
        }
        
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 2px rgba(255, 107, 139, 0.2);
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .anniversary-type-selector {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .anniversary-type-option {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .anniversary-type-option:hover {
            background-color: #f5f5f5;
        }
        
        .anniversary-type-option.selected {
            border-color: var(--primary);
            background-color: rgba(255, 107, 139, 0.1);
        }
        
        .anniversary-type-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .anniversary-type-label {
            font-size: 14px;
            font-weight: 500;
        }
        
        .repeat-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .repeat-option {
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .repeat-option:hover {
            background-color: #eaeaea;
        }
        
        .repeat-option.selected {
            background-color: var(--primary);
            color: white;
        }
        
        .reminder-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .reminder-option {
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .reminder-option:hover {
            background-color: #eaeaea;
        }
        
        .reminder-option.selected {
            background-color: var(--primary);
            color: white;
        }
        
        .form-actions {
            margin-top: 30px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 139, 0.4);
        }
        
        .info-box {
            background-color: rgba(255, 209, 102, 0.1);
            border-left: 3px solid #FFD166;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .reminder-info-box {
            background: linear-gradient(135deg, rgba(255, 107, 139, 0.08), rgba(255, 160, 122, 0.08));
            border-left: 3px solid var(--primary);
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        
        .reminder-info-box strong {
            color: var(--primary);
            font-weight: 600;
        }
        
        .reminder-example {
            margin-top: 8px;
            padding: 8px 12px;
            background-color: white;
            border-radius: 6px;
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .reminder-example-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">添加纪念日</div>
            <div class="nav-icon">←</div>
        </div>
        
        <form id="add-anniversary-form">
            <div class="form-group">
                <label class="form-label required-label" for="anniversary-name">纪念日名称</label>
                <input type="text" id="anniversary-name" class="form-input" placeholder="例如：在一起100天、兔兔生日" required>
            </div>
            
            <div class="form-group">
                <label class="form-label required-label" for="anniversary-date">纪念日日期</label>
                <input type="date" id="anniversary-date" class="form-input" required>
                <div class="info-box">
                    💡 选择的日期将用于计算倒计时和提醒
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">纪念日类型</label>
                <div class="anniversary-type-selector">
                    <div class="anniversary-type-option selected">
                        <div class="anniversary-type-icon">💖</div>
                        <div class="anniversary-type-label">恋爱纪念</div>
                    </div>
                    <div class="anniversary-type-option">
                        <div class="anniversary-type-icon">🎂</div>
                        <div class="anniversary-type-label">生日</div>
                    </div>
                    <div class="anniversary-type-option">
                        <div class="anniversary-type-icon">🌟</div>
                        <div class="anniversary-type-label">特殊日子</div>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">重复提醒</label>
                <div class="repeat-options">
                    <div class="repeat-option selected">每年提醒</div>
                    <div class="repeat-option">仅此一次</div>
                    <div class="repeat-option">每月提醒</div>
                </div>
                <div class="info-box">
                    💡 设置为"每年提醒"后，系统会在每年的这一天自动提醒
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">提前提醒</label>
                <div class="reminder-options">
                    <div class="reminder-option selected">当天</div>
                    <div class="reminder-option">提前1天</div>
                    <div class="reminder-option">提前3天</div>
                    <div class="reminder-option">提前7天</div>
                </div>
                <div class="reminder-info-box">
                    <div>
                        <strong>📱 提醒方式：</strong>系统会在首页顶部显示醒目的纪念日提醒卡片，让你不会错过任何重要时刻
                    </div>
                    <div class="reminder-example">
                        <span class="reminder-example-icon">🎉</span>
                        <span>示例："明天是你们在一起100天纪念日"</span>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="anniversary-notes">备注</label>
                <textarea id="anniversary-notes" class="form-textarea" placeholder="记录这个纪念日的特别之处..."></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存纪念日</button>
            </div>
        </form>
    </div>
    
    <script>
        // 纪念日类型选择
        const typeOptions = document.querySelectorAll('.anniversary-type-option');
        typeOptions.forEach(option => {
            option.addEventListener('click', function() {
                typeOptions.forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
            });
        });
        
        // 重复选项选择
        const repeatOptions = document.querySelectorAll('.repeat-option');
        repeatOptions.forEach(option => {
            option.addEventListener('click', function() {
                repeatOptions.forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
            });
        });
        
        // 提醒选项选择（支持多选）
        const reminderOptions = document.querySelectorAll('.reminder-option');
        reminderOptions.forEach(option => {
            option.addEventListener('click', function() {
                this.classList.toggle('selected');
            });
        });
        
        // 表单提交
        document.getElementById('add-anniversary-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('anniversary-name').value,
                date: document.getElementById('anniversary-date').value,
                type: document.querySelector('.anniversary-type-option.selected .anniversary-type-label').textContent,
                repeat: document.querySelector('.repeat-option.selected').textContent,
                reminders: Array.from(document.querySelectorAll('.reminder-option.selected')).map(el => el.textContent),
                notes: document.getElementById('anniversary-notes').value
            };
            
            console.log('纪念日数据:', formData);
            alert('纪念日添加成功！\n\n提醒将在首页顶部的纪念日卡片中显示');
        });
        
        // 返回按钮
        document.querySelector('.nav-icon').addEventListener('click', function() {
            if (confirm('确定要返回吗？未保存的内容将丢失')) {
                window.history.back();
            }
        });
    </script>
</body>
</html>
