<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 禁止缓存的 Meta 标签 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>首页 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .couple-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            color: white;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .couple-card::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .couple-avatars {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid white;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .avatar:last-child {
            margin-left: -15px;
        }
        
        .heart-icon {
            margin: 0 15px;
            color: white;
            font-size: 28px;
        }
        
        .couple-names {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .couple-days {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .couple-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .anniversary-reminder {
            background: linear-gradient(135deg, #FFD166, #FFA07A);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            color: white;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .anniversary-reminder:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        
        .anniversary-title {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .anniversary-desc {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .meal-section {
            margin: 25px 0;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .see-all {
            font-size: 14px;
            color: var(--primary);
            text-decoration: none;
        }
        
        .meals-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .meal-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .meal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        .meal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }
        
        .meal-image-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
            position: relative;
        }
        
        .meal-carousel {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }
        
        .meal-image {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 2;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .carousel-dot.active {
            width: 20px;
            border-radius: 4px;
            background-color: white;
        }
        
        .meal-image-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        
        .meal-time-badge {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .meal-type-badge {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #666;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .meal-card-content {
            padding: 20px;
        }
        
        .meal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .meal-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #888;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        
        .meal-info-icon {
            font-size: 16px;
        }
        
        .meal-anniversary-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.15), rgba(255, 160, 122, 0.15));
            border-left: 3px solid #FFD166;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #e67e00;
            font-weight: 500;
        }
        
        .meal-recipe-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(139, 195, 74, 0.1));
            border-left: 3px solid #4CAF50;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #2e7d32;
            font-weight: 500;
        }
        
        .meal-tags-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .meal-notes {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255, 107, 139, 0.03), rgba(255, 160, 122, 0.03));
            border-radius: 12px;
            border-left: 3px solid var(--primary);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            max-width: 480px;
            margin: 0 auto;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .add-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }
        
        .add-nav-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 6px 20px rgba(255, 107, 139, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin-top: -30px;
            transition: transform 0.3s;
        }
        
        .add-nav-button:hover {
            transform: scale(1.1);
        }
        
        .add-nav-label {
            margin-top: 5px;
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">一日三餐恋</div>
        </div>
        
        <div class="couple-card">
            <div class="couple-avatars">
                <div class="avatar">🐰</div>
                <div class="heart-icon">❤️</div>
                <div class="avatar">🐻</div>
            </div>
            <div class="couple-info">
                <h3 class="couple-names">兔兔 & 熊大</h3>
                <p class="couple-days">在一起的第 128 天</p>
            </div>
            
            <div class="couple-stats">
                <div class="stat">
                    <div class="stat-value">42</div>
                    <div class="stat-label">共同用餐</div>
                </div>
                <div class="stat">
                    <div class="stat-value">28</div>
                    <div class="stat-label">共同下厨</div>
                </div>
                <div class="stat">
                    <div class="stat-value">16</div>
                    <div class="stat-label">美食探索</div>
                </div>
            </div>
        </div>
        
        <div class="anniversary-reminder">
            <div class="anniversary-content">
                <div class="anniversary-title">
                    <span>🎉</span>
                    <span>纪念日提醒</span>
                </div>
                <div class="anniversary-desc">明天是你们在一起100天纪念日</div>
            </div>
        </div>
        
        <div class="meal-section">
            <div class="section-title">
                <h2>今日用餐</h2>
                <a href="#" class="see-all">查看全部</a>
            </div>
            
            <div class="meals-list" id="mealsList"></div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div>首页</div>
        </div>
        <div class="add-nav-item">
            <div class="add-nav-button">+</div>
            <div class="add-nav-label">添加</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </div>
    </div>
    
    <script>
        const mealsData = [
            {
                title: '爱心煎蛋三明治',
                time: '早餐',
                type: '🏠 在家烹饪',
                cook: '👩‍🍳👨‍🍳 一起下厨',
                notes: '兔兔今天早起做的爱心早餐，搭配新鲜牛奶，熊大特别喜欢吃。吐司烤得刚刚好，鸡蛋煎成了爱心形状💕',
                images: [
                    'https://cn.bing.com/th?id=OHR.LionDay_ZH-CN3864552438_1920x1080.jpg',
                    'https://cn.bing.com/th?id=OHR.OldTownTallinn_ZH-CN3721270247_1920x1080.jpg',
                    'https://cn.bing.com/th?id=OHR.ManhattanView_ZH-CN3614444449_1920x1080.jpg'
                ],
                anniversary: null,
                recipes: ['爱心煎蛋三明治', '法式吐司']
            },
            {
                title: '公司附近新开的日料',
                time: '午餐',
                type: '🍽️ 外出就餐',
                location: '📍 北京市朝阳区 · 日料店',
                notes: '午休时间一起探索新店，三文鱼很新鲜，环境也很不错。店员服务态度特别好，下次还想来试试他们的招牌寿司。',
                images: [
                    'https://cn.bing.com/th?id=OHR.KingfisherBed_ZH-CN3519084485_1920x1080.jpg',
                    'https://cn.bing.com/th?id=OHR.PlymouthHarbor_ZH-CN3369091693_1920x1080.jpg'
                ],
                anniversary: null,
                recipes: null
            },
            {
                title: '情人节特别晚餐',
                time: '晚餐',
                type: '🏠 在家烹饪',
                cook: '👩‍🍳👨‍🍳 一起下厨',
                notes: '为了庆祝情人节，我们精心准备了烛光晚餐。从超市买了新鲜的牛排和红酒，一起动手做了一顿浪漫大餐。',
                images: [
                    'https://cn.bing.com/th?id=OHR.AdelieBreeding_ZH-CN3246348922_1920x1080.jpg',
                    'https://cn.bing.com/th?id=OHR.PinnaclesNambung_ZH-CN3095493517_1920x1080.jpg',
                    'https://cn.bing.com/th?id=OHR.Knuthojdsmossen_ZH-CN2984846982_1920x1080.jpg',
                    'https://cn.bing.com/th?id=OHR.BasilicaSuperga_ZH-CN2857476612_1920x1080.jpg'
                ],
                anniversary: '💖 在一起100天',
                recipes: ['煎牛排', '凯撒沙拉', '提拉米苏']
            }
        ];
        
        const mealsList = document.getElementById('mealsList');
        const carousels = {};
        
        function createMealCard(meal, index) {
            const card = document.createElement('div');
            card.className = 'meal-card';
            
            let imagesHTML = '';
            if (meal.images && meal.images.length > 0) {
                imagesHTML = meal.images.map(img => 
                    `<img src="${img}" alt="${meal.title}" class="meal-image">`
                ).join('');
            }
            
            let dotsHTML = '';
            if (meal.images && meal.images.length > 1) {
                dotsHTML = `
                    <div class="carousel-dots">
                        ${meal.images.map((_, i) => 
                            `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
                        ).join('')}
                    </div>
                `;
            }
            
            let tagsHTML = '';
            if (meal.anniversary || meal.recipes) {
                tagsHTML = '<div class="meal-tags-container">';
                
                if (meal.anniversary) {
                    tagsHTML += `
                        <div class="meal-anniversary-tag">
                            <span>🎉</span>
                            <span>关联纪念日：${meal.anniversary}</span>
                        </div>
                    `;
                }
                
                if (meal.recipes && meal.recipes.length > 0) {
                    const recipesText = meal.recipes.join('、');
                    tagsHTML += `
                        <div class="meal-recipe-tag">
                            <span>📖</span>
                            <span>菜谱：${recipesText}</span>
                        </div>
                    `;
                }
                
                tagsHTML += '</div>';
            }
            
            card.innerHTML = `
                <div class="meal-image-container">
                    <div class="meal-carousel" data-carousel="${index}">
                        ${imagesHTML}
                    </div>
                    ${dotsHTML}
                    <div class="meal-image-overlay">
                        <div class="meal-time-badge">${meal.time}</div>
                        <div class="meal-type-badge">${meal.type}</div>
                    </div>
                </div>
                <div class="meal-card-content">
                    <div class="meal-title">${meal.title}</div>
                    <div class="meal-info">
                        <span class="meal-info-icon">${meal.cook || meal.location}</span>
                    </div>
                    ${tagsHTML}
                    <div class="meal-notes">${meal.notes}</div>
                </div>
            `;
            
            return card;
        }
        
        function initCarousels() {
            mealsData.forEach((meal, index) => {
                if (meal.images && meal.images.length > 1) {
                    carousels[index] = {
                        currentIndex: 0,
                        totalImages: meal.images.length,
                        interval: null
                    };
                    
                    startAutoPlay(index);
                }
            });
        }
        
        function startAutoPlay(carouselIndex) {
            carousels[carouselIndex].interval = setInterval(() => {
                const carousel = carousels[carouselIndex];
                carousel.currentIndex = (carousel.currentIndex + 1) % carousel.totalImages;
                updateCarousel(carouselIndex);
            }, 3000);
        }
        
        function updateCarousel(carouselIndex) {
            const carousel = carousels[carouselIndex];
            const carouselElement = document.querySelector(`[data-carousel="${carouselIndex}"]`);
            const dots = carouselElement.parentElement.querySelectorAll('.carousel-dot');
            
            carouselElement.style.transform = `translateX(-${carousel.currentIndex * 100}%)`;
            
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === carousel.currentIndex);
            });
        }
        
        mealsData.forEach((meal, index) => {
            const card = createMealCard(meal, index);
            mealsList.appendChild(card);
        });
        
        initCarousels();
        
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('carousel-dot')) {
                const carouselIndex = parseInt(e.target.closest('.meal-image-container').querySelector('.meal-carousel').dataset.carousel);
                const dotIndex = parseInt(e.target.dataset.index);
                
                if (carousels[carouselIndex]) {
                    clearInterval(carousels[carouselIndex].interval);
                    carousels[carouselIndex].currentIndex = dotIndex;
                    updateCarousel(carouselIndex);
                    startAutoPlay(carouselIndex);
                }
            }
        });
    </script>
</body>
</html>
