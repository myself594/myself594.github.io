<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 禁止缓存的 Meta 标签 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>美食轨迹 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        
        .journey-header {
            margin: 20px 0;
        }
        
        .journey-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .journey-header p {
            color: #666;
            font-size: 14px;
        }
        
        .journey-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .journey-stat {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .journey-stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .journey-stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .journey-tabs {
            display: flex;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 20px;
        }
        
        .journey-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .journey-tab.active {
            background-color: white;
            box-shadow: var(--shadow);
        }
        
        .journey-map {
            height: 250px;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        
        .map-point {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--primary);
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }
        
        .map-point.high {
            background-color: #ff5252;
            width: 20px;
            height: 20px;
        }
        
        .map-point.medium {
            background-color: #ff9800;
            width: 16px;
            height: 16px;
        }
        
        .map-point.low {
            background-color: #4caf50;
            width: 12px;
            height: 12px;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 107, 139, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 107, 139, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 139, 0);
            }
        }
        
        .city-ranking {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        
        .city-ranking h3 {
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .city-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .city-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .city-item:last-child {
            border-bottom: none;
        }
        
        .city-name {
            font-weight: 500;
        }
        
        .city-count {
            background-color: rgba(255, 107, 139, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .cuisine-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .cuisine-item {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .cuisine-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .cuisine-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .cuisine-count {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">美食轨迹</div>
            <div class="nav-icon">←</div>
        </div>
        
        <div class="journey-header">
            <h2>我们的美食足迹</h2>
            <p>记录我们一起探索的美食旅程</p>
        </div>
        
        <div class="journey-stats">
            <div class="journey-stat">
                <div class="journey-stat-value">8</div>
                <div class="journey-stat-label">城市</div>
            </div>
            <div class="journey-stat">
                <div class="journey-stat-value">42</div>
                <div class="journey-stat-label">用餐记录</div>
            </div>
            <div class="journey-stat">
                <div class="journey-stat-value">15</div>
                <div class="journey-stat-label">菜系</div>
            </div>
        </div>
        
        <div class="journey-tabs">
            <div class="journey-tab active">地图视图</div>
            <div class="journey-tab">城市排行</div>
            <div class="journey-tab">菜系统计</div>
        </div>
        
        <div class="journey-map">
            <div>🗺️ 美食足迹地图</div>
            <div class="map-point high" style="left: 30%; top: 40%;"></div>
            <div class="map-point high" style="left: 60%; top: 50%;"></div>
            <div class="map-point medium" style="left: 40%; top: 60%;"></div>
            <div class="map-point medium" style="left: 70%; top: 30%;"></div>
            <div class="map-point low" style="left: 20%; top: 70%;"></div>
            <div class="map-point low" style="left: 50%; top: 20%;"></div>
        </div>
        
        <div class="city-ranking">
            <h3>城市美食排行</h3>
            <div class="city-list">
                <div class="city-item">
                    <div class="city-name">北京市</div>
                    <div class="city-count">12次</div>
                </div>
                <div class="city-item">
                    <div class="city-name">上海市</div>
                    <div class="city-count">8次</div>
                </div>
                <div class="city-item">
                    <div class="city-name">广州市</div>
                    <div class="city-count">5次</div>
                </div>
                <div class="city-item">
                    <div class="city-name">深圳市</div>
                    <div class="city-count">3次</div>
                </div>
                <div class="city-item">
                    <div class="city-name">成都市</div>
                    <div class="city-count">3次</div>
                </div>
                <div class="city-item">
                    <div class="city-name">杭州市</div>
                    <div class="city-count">2次</div>
                </div>
            </div>
        </div>
        
        <div class="cuisine-stats">
            <div class="cuisine-item">
                <div class="cuisine-icon">🍜</div>
                <div class="cuisine-name">中餐</div>
                <div class="cuisine-count">18次</div>
            </div>
            <div class="cuisine-item">
                <div class="cuisine-icon">🍣</div>
                <div class="cuisine-name">日料</div>
                <div class="cuisine-count">8次</div>
            </div>
            <div class="cuisine-item">
                <div class="cuisine-icon">🍕</div>
                <div class="cuisine-name">西餐</div>
                <div class="cuisine-count">6次</div>
            </div>
            <div class="cuisine-item">
                <div class="cuisine-icon">🍲</div>
                <div class="cuisine-name">火锅</div>
                <div class="cuisine-count">5次</div>
            </div>
            <div class="cuisine-item">
                <div class="cuisine-icon">🍰</div>
                <div class="cuisine-name">甜品</div>
                <div class="cuisine-count">3次</div>
            </div>
            <div class="cuisine-item">
                <div class="cuisine-icon">☕</div>
                <div class="cuisine-name">咖啡</div>
                <div class="cuisine-count">2次</div>
            </div>
        </div>
    </div>
    
    <script>
        // 标签切换
        const tabs = document.querySelectorAll('.journey-tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // 地图点击事件
        const mapPoints = document.querySelectorAll('.map-point');
        mapPoints.forEach(point => {
            point.addEventListener('click', function() {
                alert('查看该城市的美食记录');
            });
        });
    </script>
</body>
</html>
