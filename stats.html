<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 一日三餐恋</title>
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #FFA07A;
            --accent: #FFD166;
            --light: #FFF9F0;
            --dark: #4A4A4A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            min-height: 100vh;
            box-shadow: var(--shadow);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        
        .stats-container {
            margin-top: 20px;
        }
        
        .summary-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 15px;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        
        .summary-title {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .summary-stats {
            display: flex;
            justify-content: space-between;
        }
        
        .summary-stat {
            text-align: center;
        }
        
        .summary-stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .summary-stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .stats-card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .stats-header h3 {
            font-size: 18px;
            color: var(--dark);
        }
        
        .filter-btn {
            padding: 6px 12px;
            background-color: var(--primary);
            color: white;
            border-radius: 15px;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }
        
        .chart-placeholder {
            height: 200px;
            background: linear-gradient(180deg, #f8f8f8, #eaeaea);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin: 20px 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-item {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .stat-desc {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">数据统计</div>
            <div class="nav-icon">←</div>
        </div>
        
        <div class="stats-container">
            <div class="summary-card">
                <div class="summary-title">本月总览</div>
                <div class="summary-stats">
                    <div class="summary-stat">
                        <div class="summary-stat-value">45</div>
                        <div class="summary-stat-label">总用餐次数</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">28</div>
                        <div class="summary-stat-label">共同用餐</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">15</div>
                        <div class="summary-stat-label">下厨次数</div>
                    </div>
                </div>
            </div>
            
            <div class="stats-card">
                <div class="stats-header">
                    <h3>用餐频率统计</h3>
                    <button class="filter-btn">本月</button>
                </div>
                <div class="chart-placeholder">
                    用餐频率图表
                </div>
            </div>
            
            <div class="stats-card">
                <div class="stats-header">
                    <h3>用餐类型分布</h3>
                    <button class="filter-btn">详情</button>
                </div>
                <div class="chart-placeholder">
                    用餐类型图表
                </div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number">12</div>
                    <div class="stat-desc">本月共同用餐</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">8</div>
                    <div class="stat-desc">本月外出就餐</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">5</div>
                    <div class="stat-desc">本月共同下厨</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">7</div>
                    <div class="stat-desc">本月在家烹饪</div>
                </div>
            </div>
            
            <div class="stats-grid" style="margin-top: 15px;">
                <div class="stat-item">
                    <div class="stat-number">15</div>
                    <div class="stat-desc">兔兔下厨</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">12</div>
                    <div class="stat-desc">熊大下厨</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">20</div>
                    <div class="stat-desc">共同下厨</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">5</div>
                    <div class="stat-desc">尝试新菜</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
